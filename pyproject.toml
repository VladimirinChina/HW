[project]
name = "pythonproject-hw-9-1-poetry"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
]

[tool.poetry.group.lint.dependencies]
flake8 = ">=7.3.0,<8.0.0"
black = ">=26.1.0,<27.0.0"
isort = ">=7.0.0,<8.0.0"
mypy = ">=1.19.1,<2.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line_length = 119
exclude = '''
/(
    \.git
  | \.venv
)/
'''


[tool.isort]
line_length = 119

[tool.mypy]
mypy_path = "src"
disallow_untyped_defs = true
warn_return_any = true
exclude = '.venv'

[tool.flake8]
max-line-length = 119
exclude = [".venv", ".git", "__pycache__"]